<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Home Dashboard</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>

</head>

<body>

<h1>🏠 Smart Home Dashboard</h1>

<div class="container">

<div class="card">

<h2>💡 LED1</h2>

<label class="switch">
<input type="checkbox" id="led1">
<span class="slider"></span>
</label>

</div>

<div class="card">

<h2>💡 LED2</h2>

<label class="switch">
<input type="checkbox" id="led2">
<span class="slider"></span>
</label>

</div>

<div class="card">

<h2>💡 LED3</h2>

<label class="switch">
<input type="checkbox" id="led3">
<span class="slider"></span>
</label>

</div>

<div class="card">

<h2>💡 LED4</h2>

<label class="switch">
<input type="checkbox" id="led4">
<span class="slider"></span>
</label>

</div>

<div class="card">

<h2>💡 LED5</h2>

<label class="switch">
<input type="checkbox" id="led5">
<span class="slider"></span>
</label>

</div>

<div class="card rgb-card">

<h2>🌈 RGB LED 1</h2>

<div id="picker1"></div>

</div>

<div class="card rgb-card">

<h2>🌈 RGB LED 2</h2>

<div id="picker2"></div>

</div>

<div class="master">

<button id="allOn">
🏠 ALL ON
</button>

<button id="allOff">
🏠 ALL OFF
</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
