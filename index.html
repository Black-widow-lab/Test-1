<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Home Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="container">
    <h1>🏠 Smart Home Dashboard</h1>

    <div class="card">
      <span>Relay 1</span>
      <label class="switch">
        <input type="checkbox" id="relay1">
        <span class="slider"></span>
      </label>
    </div>

    <div class="card">
      <span>Relay 2</span>
      <label class="switch">
        <input type="checkbox" id="relay2">
        <span class="slider"></span>
      </label>
    </div>

    <div class="card">
      <span>Relay 3</span>
      <label class="switch">
        <input type="checkbox" id="relay3">
        <span class="slider"></span>
      </label>
    </div>

    <div class="card">
      <span>Relay 4</span>
      <label class="switch">
        <input type="checkbox" id="relay4">
        <span class="slider"></span>
      </label>
    </div>

    <div class="card">
      <span>Relay 5</span>
      <label class="switch">
        <input type="checkbox" id="relay5">
        <span class="slider"></span>
      </label>
    </div>

    <div class="card">
      <span>Relay 6</span>
      <label class="switch">
        <input type="checkbox" id="relay6">
        <span class="slider"></span>
      </label>
    </div>

    <div class="card">
      <span>Relay 7</span>
      <label class="switch">
        <input type="checkbox" id="relay7">
        <span class="slider"></span>
      </label>
    </div>

    <div class="card">
      <span>Relay 8</span>
      <label class="switch">
        <input type="checkbox" id="relay8">
        <span class="slider"></span>
      </label>
    </div>

    <div class="master">
      <button id="allOn">🏠 ALL ON</button>
      <button id="allOff">🏠 ALL OFF</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
